name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Toolchain is pinned repo-wide via rust-toolchain.toml (channel 1.97.1),
# so every job builds with the same MSRV-grade compiler. Actions use pinned
# release tags (no mutable major tags) and the workflow declares
# least-privilege permissions (contents: read) — GPT review F-29.

jobs:
  fmt:
    name: fmt (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --manifest-path figby-rs/Cargo.toml -- --check

  test:
    name: test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            figby-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('figby-rs/Cargo.lock') }}

      - name: Fail if compile-time fixtures are untracked
        run: |
          missing=0
          for f in \
            figby-rs/tests/fixtures/FiraMono-Regular.ttf \
            figby-rs/assets/themes/default.yaml \
            figby-rs/assets/icons.yaml \
            figby-rs/assets/img/figby.block.ascii.image.txt \
            figby-rs/assets/fonts/standard.flf \
            figby-rs/assets/fonts/banner.flf \
            figby-rs/assets/fonts/big.flf; do
            if [ ! -f "$f" ]; then
              echo "::error::required fixture missing from checkout: $f"
              missing=1
            fi
          done
          exit $missing

      - name: cargo clippy (locked)
        run: cargo clippy --locked --manifest-path figby-rs/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo test (locked)
        run: cargo test --locked --manifest-path figby-rs/Cargo.toml --no-fail-fast

  docs:
    name: rustdoc (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Strict rustdoc (broken intra-doc links are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --manifest-path figby-rs/Cargo.toml --no-deps

  package:
    name: package verify + release dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: cargo package verification
        run: cargo package --locked --manifest-path figby-rs/Cargo.toml
      - name: cargo publish dry-run (release tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo publish --locked --manifest-path figby-rs/Cargo.toml --dry-run

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: cargo check (locked, all targets)
        run: cargo check --locked --manifest-path figby-rs/Cargo.toml --all-targets

  cross:
    name: build + focused tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo registry
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            figby-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('figby-rs/Cargo.lock') }}

      - name: cargo build (locked)
        run: cargo build --locked --manifest-path figby-rs/Cargo.toml --all-targets

      - name: cargo test (locked, lib)
        run: cargo test --locked --manifest-path figby-rs/Cargo.toml --lib

  wasm:
    name: wasm check + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - name: cargo check (wasm32, locked)
        run: cargo check --locked --manifest-path figby-rs/Cargo.toml --target wasm32-unknown-unknown
      - name: cargo clippy (wasm32, locked, no-deps)
        run: cargo clippy --locked --manifest-path figby-rs/Cargo.toml --target wasm32-unknown-unknown --no-deps -- -D warnings

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit (advisory gate)
        run: cargo audit --file figby-rs/Cargo.lock