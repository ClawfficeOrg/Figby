name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Fail if compile-time fixtures are untracked
        run: |
          missing=0
          for f in \
            figby-rs/tests/fixtures/FiraMono-Regular.ttf \
            figby-rs/assets/themes/default.yaml \
            figby-rs/assets/icons.yaml \
            figby-rs/assets/img/figby.block.ascii.image.txt \
            figby-rs/assets/fonts/standard.flf \
            figby-rs/assets/fonts/banner.flf \
            figby-rs/assets/fonts/big.flf; do
            if [ ! -f "$f" ]; then
              echo "::error::required fixture missing from checkout: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            figby-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('figby-rs/Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --manifest-path figby-rs/Cargo.toml -- --check

      - name: cargo clippy (locked)
        run: cargo clippy --locked --manifest-path figby-rs/Cargo.toml --all-targets --all-features -- -D warnings

      - name: cargo test (locked)
        run: cargo test --locked --manifest-path figby-rs/Cargo.toml --no-fail-fast

      - name: cargo package verification
        run: cargo package --locked --manifest-path figby-rs/Cargo.toml
