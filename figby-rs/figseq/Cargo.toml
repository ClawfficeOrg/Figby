[package]
name = "figseq"
version = "0.1.0"
edition = "2021"
description = "Reader, writer and player for Figby .figseq baked terminal animations (ratatui)"
license = "BSD-3-Clause"
authors = ["Figby contributors"]
repository = "https://github.com/ClawfficeOrg/Figby"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30.1", default-features = false, features = ["serde"] }

[dev-dependencies]
tempfile = "3"
